spring.application.name=insureflow-api
server.port=${SERVER_PORT:8080}

# Persistent local H2 database. Existing records are retained across restarts.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/insureflowdb;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.error.include-message=always

# Local demo credentials; override both with environment variables outside development.
insureflow.security.username=${INSUREFLOW_SECURITY_USERNAME:portfolio-admin}
insureflow.security.password=${INSUREFLOW_SECURITY_PASSWORD:InsureFlowDemo2026!}
